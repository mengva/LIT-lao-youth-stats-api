name: Backend CI
on:
  push:
    branches: [name of branch]
  pull_request:
    branches: [name of branch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint code with ESLint
        run: ./node_modules/.bin/eslint "**/*.{ts,tsx,js,jsx}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: devlit/name of docker repo:iamge version of docker image

      - name: Checkout k8s repository
        uses: actions/checkout@v3
        with:
          repository: LIT-SOULUTION/name of k8s (repo)
          ref: staging
          token: ${{ secrets.K8S_REPO_TOKEN }}
          path: k8srepo

      - name: Debug list repo contents
        run: |
          echo "Checking path..."
          ls -la k8srepo
          echo "Listing k8srepo/path k8s..."
          ls -la k8srepo/path k8s || echo " Path not found"

      - name: Update image tag in manifest
        run: |
          sed -i "s|image: .*|image: devlit/name of docker repo:iamge version of docker image|" k8srepo/path k8s/manifest file of k8s

      - name: Commit and push manifest update
        run: |
          cd k8srepo
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add path k8s/manifest file of k8s
          git commit -m "Update backend image to iamge version of docker image"
          git push origin staging
